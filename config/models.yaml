# Catalog of local models (Ollama) read by the Scout.
# Local models change every few months: update this file, not the code.
# Reflects the landscape as of November 2026.

# Until the Scout is ready (phase 6 of the roadmap), every agent uses this model.
fixed_model: qwen2.5-coder:7b

profiles:
  strong:       # 24 GB GPU or Mac with 32 GB+
    min_memory_gb: 24
    candidates: [qwen3-coder:30b]
  medium:       # 12-16 GB GPU or Mac with 16-24 GB
    min_memory_gb: 12
    candidates: [gpt-oss:20b, qwen2.5-coder:14b]
  weak:         # no dedicated GPU, or GPU up to 8 GB
    min_memory_gb: 0
    candidates: [qwen2.5-coder:7b, qwen2.5-coder:3b, qwen2.5-coder:1.5b]

calibration:
  min_tokens_per_second: 8   # below this, step down one profile
  task: examples/RefactorLoop.java
  system_reserve_gb: 3
  context_reserve_gb: 2
